apiVersion: v1
kind: Service
metadata:
  name: todoapp-service
  labels:
    app: todoapp
spec:
  # ============================================================================
  # SERVICE TYPE:
  # - LoadBalancer: Default for AWS ECR/EKS (provisions an AWS NLB/CLB) and K3s (uses K3s Klipper-lb).
  # - NodePort: If you want to access the app via <Node-IP>:<nodePort> without a cloud load balancer,
  #             change 'type: LoadBalancer' to 'type: NodePort'.
  # ============================================================================
  type: LoadBalancer
  # type: NodePort

  selector:
    app: todoapp

  ports:
    - name: http
      protocol: TCP
      port: 80          # Port exposed externally by the Service
      targetPort: 8000  # Port where the FastAPI container is listening
      nodePort: 30080   # Accessible on all cluster nodes at <Node-IP>:30080 (range: 30000-32767)
