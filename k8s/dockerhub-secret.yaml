apiVersion: v1
kind: Secret
metadata:
  name: dockerhub-registry-secret
  labels:
    app: todoapp
type: kubernetes.io/dockerconfigjson
stringData:
  # Dummy placeholders - Real secrets are managed and injected dynamically via Infisical
  .dockerconfigjson: |
    {
      "auths": {
        "https://index.docker.io/v1/": {
          "username": "<DOCKERHUB_USERNAME>",
          "password": "<DOCKERHUB_TOKEN_OR_PASSWORD>",
          "email": "<YOUR_EMAIL>"
        }
      }
    }
