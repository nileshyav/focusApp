apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: todoapp-infisical-secrets
  namespace: default
spec:
  # Infisical EU Region Host API
  hostAPI: https://eu.infisical.com/api
  resyncInterval: 60

  authentication:
    universalAuth:
      # Required: Tells the operator which project and environment to fetch
      secretsScope:
        projectSlug: collage-project # e.g. "todoapp-xxxx" (from Infisical Project Settings or URL)
        envSlug: dev                    # "prod", "staging", "dev"
        secretsPath: "/"                 # Root directory
      credentialsRef:
        secretName: infisical-auth-credentials
        secretNamespace: default

  managedKubeSecretReferences:
    # --------------------------------------------------------------------------
    # 1. Application Database & Supabase credentials for deployment.yaml
    # --------------------------------------------------------------------------
    - secretName: todoapp-secret
      secretNamespace: default
      creationPolicy: Owner

    # --------------------------------------------------------------------------
    # 2. Private Docker Hub Registry Secret for imagePullSecrets
    # --------------------------------------------------------------------------
    - secretName: dockerhub-registry-secret
      secretNamespace: default
      secretType: kubernetes.io/dockerconfigjson
      creationPolicy: Owner
      template:
        data:
          .dockerconfigjson: '{"auths":{"https://index.docker.io/v1/":{"username":"{{ .DOCKER_USERNAME.Value }}","password":"{{ .DOCKER_PASSWORD.Value }}","email":"{{ .DOCKER_EMAIL.Value }}"}}}'
