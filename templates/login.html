<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In - TaskFlow</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.7.2/dist/full.min.css" rel="stylesheet" type="text/css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-center items-center p-4">
    <!-- Background Gradient Glows -->
    <div class="fixed inset-0 overflow-hidden pointer-events-none z-0">
        <div class="absolute -top-40 -left-40 w-96 h-96 bg-indigo-600/20 rounded-full blur-3xl"></div>
        <div class="absolute -bottom-40 -right-40 w-96 h-96 bg-purple-600/20 rounded-full blur-3xl"></div>
    </div>

    <div class="w-full max-w-md bg-slate-900/80 backdrop-blur-xl border border-white/10 p-8 rounded-3xl shadow-2xl z-10">
        <!-- Brand Header -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-12 h-12 rounded-2xl bg-indigo-600/30 text-indigo-400 border border-indigo-500/30 mb-3 shadow-lg shadow-indigo-500/10">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
            </div>
            <h1 class="text-2xl font-bold text-white tracking-tight">Welcome Back</h1>
            <p class="text-slate-400 text-sm mt-1">Log in to manage your tasks & pomodoro focus</p>
        </div>

        {% if error %}
        <div class="alert alert-error bg-rose-500/20 border-rose-500/30 text-rose-200 text-sm mb-6 rounded-2xl">
            <span>⚠️ {{ error }}</span>
        </div>
        {% endif %}

        <!-- Login Form -->
        <form action="/login" method="POST" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1.5">Email Address</label>
                <input type="email" name="email" required placeholder="you@example.com" class="input input-bordered w-full bg-slate-800/80 border-white/10 focus:border-indigo-500 rounded-2xl text-slate-100 placeholder-slate-500">
            </div>

            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1.5">Password</label>
                <input type="password" name="password" required placeholder="••••••••" class="input input-bordered w-full bg-slate-800/80 border-white/10 focus:border-indigo-500 rounded-2xl text-slate-100 placeholder-slate-500">
            </div>

            <button type="submit" class="btn btn-primary w-full bg-indigo-600 hover:bg-indigo-500 border-none text-white font-semibold rounded-2xl shadow-lg shadow-indigo-600/30 mt-2">
                Log In
            </button>
        </form>

        <!-- Divider -->
        <div class="divider my-6 text-slate-500 text-xs uppercase tracking-widest">Or Offline Dev</div>

        <!-- Dev Bypass Fast Login -->
        <form action="/dev-login" method="POST">
            <input type="hidden" name="email" value="dev@local.com">
            <button type="submit" class="btn btn-outline w-full border-white/10 hover:border-indigo-500/40 text-slate-300 hover:text-white rounded-2xl font-medium">
                ⚡ Dev 1-Click Fast Login
            </button>
        </form>

        <p class="text-center text-xs text-slate-400 mt-6">
            Don't have an account? <a href="/signup" class="text-indigo-400 font-semibold hover:underline">Sign up</a>
        </p>
    </div>
</body>
</html>
